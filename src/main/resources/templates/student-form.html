<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${formTitle} + ' | Student records'">Student record</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="page-shell">
    <div th:replace="~{fragments :: header}"></div>
    <main class="form-page">
        <a class="back-link" th:href="@{/#students}">Back to records</a>
        <h1 th:text="${formTitle}">Student record</h1>
        <form class="record-form" th:object="${studentForm}" th:action="${formAction}" method="post">
            <div class="field">
                <label for="fullName">Full name</label>
                <input id="fullName" type="text" th:field="*{fullName}" maxlength="100" autocomplete="name" required>
                <p class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></p>
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input id="email" type="email" th:field="*{email}" maxlength="100" autocomplete="email" required>
                <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
            </div>
            <div class="field">
                <label for="dateOfBirth">Date of birth</label>
                <input id="dateOfBirth" type="date" th:field="*{dateOfBirth}" th:attr="max=${today}" required>
                <p class="field-error" th:if="${#fields.hasErrors('dateOfBirth')}" th:errors="*{dateOfBirth}"></p>
            </div>
            <div class="form-actions">
                <button class="button button-primary" type="submit">Save student</button>
                <a class="button button-quiet" th:href="@{/#students}">Cancel</a>
            </div>
        </form>
    </main>
</div>
</body>
</html>
