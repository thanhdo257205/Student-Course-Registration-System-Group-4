<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Enrollments | Course registration</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="page-shell">
    <div th:replace="~{fragments :: header}"></div>
    <main>
        <div class="page-intro">
            <div>
                <a class="back-link" th:href="@{/}">All records</a>
                <h1>Enrollments</h1>
                <p class="intro-copy">Students registered for courses.</p>
            </div>
            <a class="button button-primary" th:href="@{/enrollments/new}">Add enrollment</a>
        </div>
        <div th:if="${successMessage}" class="notice notice-success" role="status" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="notice notice-error" role="alert" th:text="${errorMessage}"></div>
        <form class="search-form" th:action="@{/enrollments}" method="get" role="search">
            <label class="visually-hidden" for="enrollmentSearch">Search enrollments</label>
            <input id="enrollmentSearch" type="search" name="q" th:value="${query}"
                   placeholder="Search by student name, email, or course" maxlength="100">
            <button class="button button-secondary" type="submit">Search</button>
            <a class="text-action" th:if="${!#strings.isEmpty(query)}" th:href="@{/enrollments}">Clear</a>
        </form>
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th scope="col">Student</th>
                    <th scope="col">Course</th>
                    <th scope="col">Enrollment date</th>
                    <th scope="col"><span class="visually-hidden">Actions</span></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="enrollment : ${records.content}">
                    <td data-label="Student" th:text="${enrollment.student.fullName}"></td>
                    <td data-label="Course" th:text="${enrollment.course.courseName}"></td>
                    <td data-label="Enrollment date" th:text="${enrollment.enrollmentDate}"></td>
                    <td class="actions-cell">
                        <a class="text-action" th:href="@{/enrollments/{id}/edit(id=${enrollment.enrollmentId})}">Edit</a>
                        <form th:action="@{/enrollments/{id}/delete(id=${enrollment.enrollmentId})}" method="post"
                              onsubmit="return confirm('Delete this enrollment record?')">
                            <button class="text-action text-danger" type="submit">Delete</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${records.empty}">
                    <td class="empty-state" colspan="4"
                        th:text="${#strings.isEmpty(query) ? 'No enrollment records yet. Add an enrollment after adding a student and course.' : 'No enrollments match your search.'}">
                        No enrollment records yet.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div th:replace="~{fragments :: pagination(${records}, '/enrollments', ${query})}"></div>
    </main>
</div>
</body>
</html>
