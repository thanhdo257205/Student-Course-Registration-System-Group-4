<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Students | Course registration</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="page-shell">
    <div th:replace="~{fragments :: header}"></div>
    <main>
        <div class="page-intro">
            <div>
                <a class="back-link" th:href="@{/}">All records</a>
                <h1>Students</h1>
                <p class="intro-copy">Student contact and date of birth records.</p>
            </div>
            <a class="button button-primary" th:href="@{/students/new}">Add student</a>
        </div>
        <div th:if="${successMessage}" class="notice notice-success" role="status" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="notice notice-error" role="alert" th:text="${errorMessage}"></div>
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th scope="col">Full name</th>
                    <th scope="col">Email</th>
                    <th scope="col">Date of birth</th>
                    <th scope="col"><span class="visually-hidden">Actions</span></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="student : ${records.content}">
                    <td data-label="Full name" th:text="${student.fullName}"></td>
                    <td data-label="Email" th:text="${student.email}"></td>
                    <td data-label="Date of birth" th:text="${student.dateOfBirth}"></td>
                    <td class="actions-cell">
                        <a class="text-action" th:href="@{/students/{id}/edit(id=${student.studentId})}">Edit</a>
                        <form th:action="@{/students/{id}/delete(id=${student.studentId})}" method="post"
                              onsubmit="return confirm('Delete this student record?')">
                            <button class="text-action text-danger" type="submit">Delete</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${records.empty}">
                    <td class="empty-state" colspan="4">No student records yet. Add a student to get started.</td>
                </tr>
                </tbody>
            </table>
        </div>
        <div th:replace="~{fragments :: pagination(${records}, '/students')}"></div>
    </main>
</div>
</body>
</html>
