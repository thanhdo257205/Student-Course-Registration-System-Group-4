<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${formTitle} + ' | Student records'">Course record</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="page-shell">
    <div th:replace="~{fragments :: header}"></div>
    <main class="form-page">
        <a class="back-link" th:href="@{/#courses}">Back to records</a>
        <h1 th:text="${formTitle}">Course record</h1>
        <form class="record-form" th:object="${courseForm}" th:action="${formAction}" method="post">
            <div class="field">
                <label for="courseName">Course name</label>
                <input id="courseName" type="text" th:field="*{courseName}" maxlength="100" required>
                <p class="field-error" th:if="${#fields.hasErrors('courseName')}" th:errors="*{courseName}"></p>
            </div>
            <div class="field">
                <label for="instructorName">Instructor name</label>
                <input id="instructorName" type="text" th:field="*{instructorName}" maxlength="100" required>
                <p class="field-error" th:if="${#fields.hasErrors('instructorName')}" th:errors="*{instructorName}"></p>
            </div>
            <div class="field">
                <label for="capacity">Capacity</label>
                <input id="capacity" type="number" th:field="*{capacity}" min="1" required>
                <p class="field-error" th:if="${#fields.hasErrors('capacity')}" th:errors="*{capacity}"></p>
            </div>
            <div class="form-actions">
                <button class="button button-primary" type="submit">Save course</button>
                <a class="button button-quiet" th:href="@{/#courses}">Cancel</a>
            </div>
        </form>
    </main>
</div>
</body>
</html>
