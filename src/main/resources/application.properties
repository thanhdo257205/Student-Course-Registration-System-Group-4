spring.application.name=group4

# SQL Server - doc tu bien moi truong, khong commit mat khau that len GitHub.
# Dat DB_URL / DB_USERNAME / DB_PASSWORD tren may (hoac tren Render) de ghi de gia tri mac dinh.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=student_course_db;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Bang duoc tao bang docs/database.sql, Hibernate chi kiem tra, khong tu sua schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Apply safe, idempotent SQL Server schema updates before Hibernate validates entities.
spring.sql.init.mode=always

spring.thymeleaf.cache=false

# Cot chuoi trong DB la NVARCHAR, bao Hibernate dung NVARCHAR de validate khong loi
spring.jpa.properties.hibernate.use_nationalized_character_data=true

# Chi luu session bang cookie, khong gan ;jsessionid vao URL khi redirect
server.servlet.session.tracking-modes=cookie
